[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sciforge-evidence-dag"
version = "1.0.0"
description = "SciForge Evidence DAG compiler with Artifact Registry and immutable snapshots"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
evidence-dag-server = "evidence_dag.server:main"

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
