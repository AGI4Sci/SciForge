# Install as:
#   /etc/nginx/zulip-include/app.d/sciforge-collaboration.conf
#
# Include this file inside the deployment's existing HTTPS server block.
# Nginx strips the public /collaboration/ prefix before proxying to the
# loopback-only collaboration server.

location = /collaboration {
    return 308 /collaboration/$is_args$args;
}

location ^~ /collaboration/ {
    proxy_pass http://127.0.0.1:8787/;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /collaboration;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 75s;
    proxy_buffering off;
    client_max_body_size 64k;
}
