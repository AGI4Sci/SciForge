<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SciForge Project DAG</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,sans-serif;background:#0c1117;color:#e6edf3;--panel:#161b22;--line:#30363d;--muted:#8b949e;--accent:#58a6ff;--good:#3fb950;--warn:#d29922;--bad:#f85149}
    *{box-sizing:border-box}body{margin:0;padding:24px;max-width:1440px}h1{font-size:22px;margin:0}h2{font-size:17px;margin:0 0 12px}h3{font-size:14px;margin:18px 0 8px}p{line-height:1.5}button{font:inherit;background:#238636;color:#fff;border:1px solid transparent;border-radius:6px;padding:8px 12px;cursor:pointer}button:hover{filter:brightness(1.12)}button:focus-visible,.claim-button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}code,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;overflow-wrap:anywhere}.muted{color:var(--muted)}.bad{color:var(--bad)}.good{color:var(--good)}.warn{color:var(--warn)}
    .toolbar{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;flex-wrap:wrap}.toolbar p{margin:6px 0 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.card{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:14px;min-width:0}.summary{margin-top:16px}.summary p{margin:8px 0 0}.workspace{display:grid;grid-template-columns:minmax(270px,0.7fr) minmax(440px,1.6fr);gap:14px;margin-top:14px}.claim-list{display:flex;flex-direction:column;gap:8px;max-height:72vh;overflow:auto}.claim-button{width:100%;text-align:left;color:inherit;background:#0d1117;border:1px solid var(--line);padding:11px;border-radius:8px}.claim-button[aria-current="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}.claim-title{display:block;font-weight:650;line-height:1.4}.claim-meta{display:flex;gap:7px;align-items:center;margin-top:7px;flex-wrap:wrap}.badge{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;padding:2px 7px;font-size:11px}.status-supported{color:var(--good)}.status-fragile,.status-undetermined{color:var(--warn)}.status-conflicted,.status-invalidated{color:var(--bad)}
    .detail{min-height:360px}.statement{font-size:18px;font-weight:650;line-height:1.45;margin:4px 0 12px}.facts{display:flex;gap:8px;flex-wrap:wrap}.section{border-top:1px solid var(--line);padding-top:2px;margin-top:16px}.path,.relation,.artifact,.history,.impact,.breakpoint{border-left:3px solid var(--line);padding:8px 10px;margin:8px 0;background:#0d1117;border-radius:0 6px 6px 0}.path.strongest{border-left-color:var(--good)}.breakpoint{border-left-color:var(--warn)}.relation-opposes{border-left-color:var(--bad)}.relation-qualifies{border-left-color:var(--warn)}.row{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.row>*{min-width:0}.compact{margin:5px 0}.plain-list{margin:7px 0;padding-left:20px}.plain-list li{margin:5px 0}.empty{color:var(--muted);font-style:italic}.locator-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.open-link{color:var(--accent)}.what-if-buttons{display:flex;gap:7px;flex-wrap:wrap}.what-if-buttons button{background:#21262d;border-color:var(--line);padding:6px 9px}.what-if-buttons button[aria-pressed="true"]{border-color:var(--accent);color:#fff}.below{margin-top:14px}.error{background:#2d1117;border:1px solid #6e2530;border-radius:8px;padding:11px;margin-top:12px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    @media(max-width:850px){body{padding:16px}.workspace{grid-template-columns:1fr}.claim-list{max-height:42vh}}
  </style>
</head>
<body>
  <header class="toolbar">
    <div>
      <h1>Project Evidence DAG</h1>
      <p class="muted">只读取已提交 Snapshot。刷新与 what-if 都不会触发计算或修改图；更新统一进入持久化 <code>POST /updates</code>。</p>
    </div>
    <button id="refresh" type="button">刷新已提交状态</button>
  </header>
  <div id="error" role="alert" aria-live="polite"></div>
  <section id="summary" class="grid summary" aria-label="Project committed snapshot summary"></section>
  <main class="workspace">
    <section class="card" aria-labelledby="claims-heading">
      <div class="row"><h2 id="claims-heading">Claims</h2><span id="claim-count" class="muted"></span></div>
      <div id="claims" class="claim-list" role="listbox" aria-label="Committed Project Claims"></div>
    </section>
    <article id="claim-detail" class="card detail" aria-labelledby="claim-detail-heading">
      <h2 id="claim-detail-heading">Claim 详情</h2>
      <p class="empty">选择一条 Claim，查看跨层原始证据、Decision 历史和只读 what-if。</p>
    </article>
  </main>
  <div class="grid below">
    <section class="card"><h2>Attention frontier</h2><div id="attention">—</div></section>
    <section class="card"><h2>Current snapshot findings</h2><div id="findings">—</div></section>
  </div>

<script id="claim-detail-pure">
function list(value){return Array.isArray(value)?value:[]}
function object(value){return value&&typeof value==='object'&&!Array.isArray(value)?value:{}}
function parseMeta(value){if(value&&typeof value==='object')return value;if(typeof value!=='string')return{};try{return object(JSON.parse(value))}catch{return{}}}
function levelRank(value){const match=/^L([0-4])$/.exec(String(value||''));return match?Number(match[1]):0}
function normalizedLocator(value){
  const locator=String(value||'').trim();if(!locator)return null;
  if(/^(runtime|trace):/i.test(locator))return null;
  if(/^doi:/i.test(locator))return `doi:${locator.slice(4).trim().toLowerCase()}`;
  try{const url=new URL(locator);url.hash='';if(/^https?:$/i.test(url.protocol)){const doi=url.hostname.toLowerCase()==='doi.org'?decodeURIComponent(url.pathname.slice(1)).toLowerCase():null;return doi?`doi:${doi}`:url.toString()}}catch{}
  return `locator:${locator}`;
}
function sourceAliases(assertion){
  const artifact=object(assertion.artifact),version=object(assertion.artifactVersion);
  if(levelRank(assertion.level)<1)return [];
  return [...new Set([normalizedLocator(version.locator),assertion.artifactId?`artifact:${assertion.artifactId}`:null,(version.contentDigest||artifact.contentDigest)?`digest:${version.contentDigest||artifact.contentDigest}`:null].filter(Boolean))];
}
function sourceIdentity(assertion){return sourceAliases(assertion)[0]||null}
function sourceLabel(assertion){
  const artifact=object(assertion.artifact),version=object(assertion.artifactVersion);
  return version.locator||artifact.title||assertion.artifactId||assertion.sourceAssertionId||'未识别来源';
}
function independentSources(paths){
  const groups=[],unresolved=[];
  for(const path of list(paths))for(const assertion of list(path.sourceAssertions)){
    const aliases=new Set(sourceAliases(assertion));
    if(!aliases.size){unresolved.push({threadId:path.threadId,sourceAssertionId:assertion.sourceAssertionId});continue}
    const matches=groups.filter(group=>[...aliases].some(alias=>group.aliases.has(alias)));
    const current=matches.shift()||{aliases:new Set(),label:sourceLabel(assertion),threads:new Set(),occurrences:0,maxLevel:'L0'};
    for(const match of matches){for(const alias of match.aliases)current.aliases.add(alias);for(const thread of match.threads)current.threads.add(thread);current.occurrences+=match.occurrences;if(levelRank(match.maxLevel)>levelRank(current.maxLevel))current.maxLevel=match.maxLevel;groups.splice(groups.indexOf(match),1)}
    for(const alias of aliases)current.aliases.add(alias);
    current.threads.add(path.threadId);current.occurrences+=1;
    if(levelRank(assertion.level)>levelRank(current.maxLevel))current.maxLevel=assertion.level;
    if(!groups.includes(current))groups.push(current);
  }
  return {sources:groups.map(item=>({key:[...item.aliases].sort()[0],label:item.label,threads:[...item.threads].sort(),occurrences:item.occurrences,maxLevel:item.maxLevel})).sort((a,b)=>a.label.localeCompare(b.label)),unresolved};
}
function supportQualityForPath(path,supports){
  const values=[];
  for(const support of list(supports)){
    const meta=parseMeta(support.edge_meta),origins=list(meta.origins).length?list(meta.origins):[{session:meta.session,node:meta.claim_node}];
    if(origins.some(origin=>origin.session===path.threadId&&(!origin.node||origin.node===path.sessionClaimId))&&Number.isFinite(Number(support.quality_score)))values.push(Number(support.quality_score));
  }
  return values.length?Math.max(...values):null;
}
function rankPaths(paths,supports){
  return list(paths).map(path=>{
    const assertions=list(path.sourceAssertions),quality=supportQualityForPath(path,supports);
    const anchored=assertions.filter(item=>object(item.sourceAnchor).selector).length;
    const verifiable=assertions.filter(item=>object(item.artifactVersion).contentDigest&&object(item.sourceAnchor).anchorDigest).length;
    return {...path,dimensions:{provenanceLevel:path.level||'L0',sourceQuality:quality,anchoredAssertions:anchored,verifiableAssertions:verifiable,assertionCount:assertions.length}};
  }).sort((a,b)=>levelRank(b.dimensions.provenanceLevel)-levelRank(a.dimensions.provenanceLevel)||b.dimensions.verifiableAssertions-a.dimensions.verifiableAssertions||b.dimensions.anchoredAssertions-a.dimensions.anchoredAssertions||(b.dimensions.sourceQuality??-1)-(a.dimensions.sourceQuality??-1)||String(a.threadId).localeCompare(String(b.threadId)));
}
function edgeOtherClaim(edge,claimId){return edge.src===claimId?edge.dst:edge.dst===claimId?edge.src:null}
function relationModel(detail,graph){
  const claims=new Map(list(graph.claims).map(item=>[item.id,item])),edges=list(graph.edges),claimId=detail.id;
  const opposing=list(detail.contradicts).map(edge=>{const other=edgeOtherClaim(edge,claimId);return {edge,claim:claims.get(other)||{id:other,statement:'关联 Claim 不在当前 committed scope'}}});
  const refinements=edges.filter(edge=>edge.edge_type==='derived_from'&&(edge.src===claimId||edge.dst===claimId)).map(edge=>{
    const other=edgeOtherClaim(edge,claimId),direction=edge.src===claimId?'refines':'refined_by';
    return {kind:'refinement',direction,edge,claim:claims.get(other)||{id:other,statement:'关联 Claim 不在当前 committed scope'}};
  });
  const applicability=list(detail.assessments).filter(item=>item.dimension==='applicability'&&item.result!=='passed').map(item=>({kind:'applicability',assessment:item}));
  const declared=[];
  for(const support of list(detail.supports))for(const value of list(parseMeta(support.edge_meta).qualifiers))declared.push({kind:'declared',value,supportId:support.id});
  return {supports:list(detail.supports),opposing,qualifications:[...refinements,...applicability,...declared]};
}
function referencesClaim(value,claimId){
  if(value===claimId)return true;
  if(Array.isArray(value))return value.some(item=>referencesClaim(item,claimId));
  if(value&&typeof value==='object')return Object.values(value).some(item=>referencesClaim(item,claimId));
  return false;
}
function statusHistoryModel(detail,snapshot,findings){
  const relatedFindings=list(findings).filter(item=>item.subject_id===detail.id),findingIds=new Set(relatedFindings.map(item=>item.id));
  const decisions=list(object(snapshot.graph).decisions).filter(item=>findingIds.has(item.finding_id)||item.subject_id===detail.id);
  const diffEvents=[];for(const [kind,entries] of Object.entries(object(snapshot.compileDiff)))for(const entry of list(entries))if(referencesClaim(entry,detail.id))diffEvents.push({kind,entry});
  return {snapshot:{digest:snapshot.digest,version:snapshot.version,createdAt:snapshot.createdAt,status:detail.status},diffEvents,assessments:list(detail.assessments),findings:relatedFindings,decisions:decisions.sort((a,b)=>String(b.created_at).localeCompare(String(a.created_at)))};
}
function whatIfImpact(graph,removedSourceId){
  const claims=new Map(list(graph.claims).map(item=>[item.id,item])),edges=list(graph.edges);
  const supportEdges=edges.filter(edge=>edge.edge_type==='supports'),directIds=[...new Set(supportEdges.filter(edge=>edge.src===removedSourceId&&claims.has(edge.dst)).map(edge=>edge.dst))];
  const impacts=new Map(directIds.map(id=>[id,{claim:claims.get(id),kind:supportEdges.filter(edge=>edge.dst===id&&edge.src!==removedSourceId).length?'weakened':'unsupported',remainingSupportCount:supportEdges.filter(edge=>edge.dst===id&&edge.src!==removedSourceId).length,distance:0}]));
  const queue=[...directIds];
  while(queue.length){const current=queue.shift(),distance=impacts.get(current).distance;for(const edge of edges){let next=null;if(edge.edge_type==='derived_from'&&edge.dst===current)next=edge.src;else if(edge.edge_type==='supports'&&edge.src===current)next=edge.dst;else if(edge.edge_type==='same_as'&&edge.src===current)next=edge.dst;else if(edge.edge_type==='same_as'&&edge.dst===current)next=edge.src;if(next&&claims.has(next)&&!impacts.has(next)){impacts.set(next,{claim:claims.get(next),kind:'downstream',remainingSupportCount:null,distance:distance+1});queue.push(next)}}}
  return {removedSourceId,directCount:directIds.length,affected:[...impacts.values()].sort((a,b)=>a.distance-b.distance||String(a.claim.id).localeCompare(String(b.claim.id)))};
}
function locatorTarget(assertion){
  const artifact=object(assertion.artifact),version=object(assertion.artifactVersion),access=artifact.accessPolicy;
  if(artifact.availability==='restricted'||access==='restricted'||(access&&typeof access==='object'&&access.read===false))return null;
  const locator=String(version.locator||'').trim();
  if(/^https?:\/\//i.test(locator))return locator;
  if(/^doi:/i.test(locator))return `https://doi.org/${encodeURIComponent(locator.slice(4).trim())}`;
  return null;
}
</script>
<script>
const query=new URLSearchParams(location.search),hash=new URLSearchParams(location.hash.slice(1));
const token=hash.get('token')||'',projectKey=query.get('projectKey')||projectKeyFromLabels();
const state={status:null,graph:null,attention:[],findings:[],selectedClaimId:null,detail:null,whatIfSourceId:null};
function projectKeyFromLabels(){const path=query.get('projectRoot')||query.get('workspaceRoot');if(path)return `path:${path}`;const project=query.get('project');return project?`project:${project}`:''}
async function api(path){if(!projectKey)throw new Error('缺少 projectKey/workspaceRoot/project');const sep=path.includes('?')?'&':'?';const response=await fetch(`${path}${sep}projectKey=${encodeURIComponent(projectKey)}`,{headers:{Authorization:`Bearer ${token}`,Accept:'application/json'}});const body=await response.json();if(!response.ok||!body.ok)throw new Error(body.error?.message||`HTTP ${response.status}`);return body.data}
function escapeHtml(value){return String(value??'').replace(/[&<>'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]))}
function pretty(value){return escapeHtml(JSON.stringify(value,null,2))}
function short(value,size=12){const text=String(value||'');return text.length>size?`${text.slice(0,size)}…`:text||'—'}
function statusClass(value){return `status-${String(value||'undetermined').replace(/[^a-z_-]/gi,'')}`}
function renderError(error){document.getElementById('error').innerHTML=error?`<div class="error">${escapeHtml(error.message||error)}</div>`:''}
function renderSummary(){
  const snapshot=object(state.graph?.snapshot),status=object(state.status),scope={included:list(snapshot.evidenceVector).map(item=>item.threadId),excluded:list(snapshot.excludedSessions),isolated:list(snapshot.isolatedSessions)};
  document.getElementById('summary').innerHTML=`<div class="card"><b>更新状态</b><p class="${status.state==='fresh'?'good':status.state==='update_failed'?'bad':'warn'}">${escapeHtml(status.state||'—')}</p></div><div class="card"><b>Committed snapshot</b><p class="mono" title="${escapeHtml(snapshot.digest)}">v${escapeHtml(snapshot.version||'—')} · ${escapeHtml(short(snapshot.digest,18))}</p></div><div class="card"><b>固定 Evidence vector</b><p>${scope.included.length} included · ${scope.excluded.length} excluded · ${scope.isolated.length} isolated</p></div><div class="card"><b>Attention frontier</b><p>${list(state.attention).length} 个当前关键项</p></div>`;
}
function renderClaims(){
  const claims=list(state.graph?.claims),container=document.getElementById('claims');document.getElementById('claim-count').textContent=String(claims.length);
  if(!claims.length){container.innerHTML='<p class="empty">当前 committed snapshot 没有 Claim。</p>';return}
  container.innerHTML=claims.map(claim=>`<button type="button" class="claim-button" role="option" data-claim-id="${escapeHtml(claim.id)}" aria-current="${claim.id===state.selectedClaimId}"><span class="claim-title">${escapeHtml(claim.statement)}</span><span class="claim-meta"><span class="badge ${statusClass(claim.status)}">${escapeHtml(claim.status)}</span><span class="badge">${escapeHtml(claim.claim_type)}</span><span class="muted mono">${escapeHtml(short(claim.id))}</span></span></button>`).join('');
  for(const button of container.querySelectorAll('[data-claim-id]'))button.onclick=()=>selectClaim(button.dataset.claimId);
}
function scopeHtml(detail,snapshot){
  const sessions=[...new Set(list(detail.origins).map(item=>item.session_id))];
  return `<div class="facts"><span class="badge ${statusClass(detail.status)}">状态 ${escapeHtml(detail.status)}</span><span class="badge">类型 ${escapeHtml(detail.claim_type)}</span><span class="badge">Goal ${escapeHtml(short(detail.goal_id,18))}</span><span class="badge">版本 v${escapeHtml(snapshot.version)}</span></div><p class="compact muted">适用 scope：${sessions.length?escapeHtml(sessions.join('、')):'无 session origin'}；snapshot 固化 ${list(snapshot.evidenceVector).length} 个 included session，${list(snapshot.excludedSessions).length} excluded，${list(snapshot.isolatedSessions).length} isolated。</p>`;
}
function pathHtml(path,index){
  const dimensions=path.dimensions,assertions=list(path.sourceAssertions);
  return `<div class="path ${index===0?'strongest':''}"><div class="row"><b>${index===0?'最强路径':'独立候选路径'} · ${escapeHtml(path.threadId)}</b><span class="badge">${escapeHtml(dimensions.provenanceLevel)}</span></div><p class="compact muted">session Claim ${escapeHtml(path.sessionClaimId||'—')} · source quality ${dimensions.sourceQuality==null?'未记录':escapeHtml(dimensions.sourceQuality.toFixed(2))} · anchored ${dimensions.anchoredAssertions}/${dimensions.assertionCount} · verifiable ${dimensions.verifiableAssertions}/${dimensions.assertionCount}</p>${assertions.length?`<ul class="plain-list">${assertions.map(item=>`<li>${escapeHtml(item.content||item.sourceAssertionId)} <span class="muted">(${escapeHtml(item.level)})</span>${list(item.sessionPath).length?`<details><summary>Session provenance edges</summary><pre>${pretty(item.sessionPath)}</pre></details>`:''}</li>`).join('')}</ul>`:'<p class="empty">此 session origin 未找到 SourceAssertion 路径。</p>'}</div>`;
}
function relationItem(value,type){
  if(type==='support')return `<div class="relation"><b>${escapeHtml(value.content||value.id)}</b><p class="compact muted">${escapeHtml(value.evidence_type)} · source quality ${value.quality_score==null?'未记录':escapeHtml(Number(value.quality_score).toFixed(2))} · ${escapeHtml(value.id)}</p></div>`;
  if(type==='oppose')return `<div class="relation relation-opposes"><b>${escapeHtml(value.claim.statement)}</b><p class="compact muted">${escapeHtml(value.claim.status||'not in scope')} · ${escapeHtml(value.claim.id)}</p></div>`;
  if(value.kind==='refinement')return `<div class="relation relation-qualifies"><b>${value.direction==='refines'?'当前 Claim 限定/细化':'被下列 Claim 限定/细化'}：${escapeHtml(value.claim.statement)}</b><p class="compact muted">derived_from · ${escapeHtml(value.claim.id)}</p></div>`;
  if(value.kind==='applicability')return `<div class="relation relation-qualifies"><b>适用性 ${escapeHtml(value.assessment.result)}</b><p class="compact muted">${escapeHtml(parseMeta(value.assessment.details).reason||value.assessment.reason||'assessment 未提供原因')} · ${escapeHtml(value.assessment.level)}</p></div>`;
  return `<div class="relation relation-qualifies"><b>${escapeHtml(value.value)}</b><p class="compact muted">support ${escapeHtml(value.supportId)}</p></div>`;
}
function artifactHtml(assertion,path){
  const artifact=object(assertion.artifact),version=object(assertion.artifactVersion),anchor=object(assertion.sourceAnchor),selector=object(anchor.selector),target=locatorTarget(assertion),restricted=artifact.availability==='restricted'||artifact.accessPolicy==='restricted'||object(artifact.accessPolicy).read===false;
  const availability=restricted?'受访问策略限制':target?'可在当前界面打开':'已记录 locator；当前界面不可直接打开';
  return `<div class="artifact"><div class="row"><b>${escapeHtml(artifact.kind||'artifact')} · ${escapeHtml(assertion.artifactId||'未注册')}</b><span class="badge">${escapeHtml(assertion.level||path.level)}</span></div><div class="locator-actions"><span class="mono">${restricted?'[restricted]':escapeHtml(version.locator||'无 locator')}</span>${target?`<a class="open-link" href="${escapeHtml(target)}" target="_blank" rel="noopener noreferrer">打开原始工件</a>`:''}</div><p class="compact muted">${escapeHtml(availability)} · version ${escapeHtml(assertion.artifactVersionId||'—')} · content hash ${escapeHtml(short(version.contentDigest||artifact.contentDigest,22))}</p><p class="compact">Anchor：${anchor.sourceAnchorId||assertion.sourceAnchorId?escapeHtml(assertion.sourceAnchorId||anchor.sourceAnchorId):'无'} · selector ${Object.keys(selector).length?`<code>${pretty(selector)}</code>`:'未定位'} · anchor hash ${escapeHtml(short(anchor.anchorDigest,22))}</p>${assertion.run?`<details><summary>Run inputs / software / parameters / environment / outputs</summary><pre>${pretty(assertion.run)}</pre></details>`:''}</div>`;
}
function historyHtml(history){
  const events=[`<div class="history"><b>Committed Snapshot v${escapeHtml(history.snapshot.version)}</b><p class="compact muted">${escapeHtml(history.snapshot.createdAt)} · ${escapeHtml(history.snapshot.digest)} · 当前状态 ${escapeHtml(history.snapshot.status)}</p></div>`];
  for(const event of history.diffEvents)events.push(`<div class="history"><b>Compile diff · ${escapeHtml(event.kind)}</b><pre>${pretty(event.entry)}</pre></div>`);
  for(const finding of history.findings)events.push(`<div class="history"><b>Audit Finding · ${escapeHtml(finding.finding_type)}</b><p class="compact muted">${escapeHtml(finding.status)} · ${escapeHtml(finding.severity)} · ${escapeHtml(finding.target_digest)}</p></div>`);
  for(const decision of history.decisions)events.push(`<div class="history"><b>${escapeHtml(decision.decided_by)} Decision · ${escapeHtml(decision.action)}</b><p class="compact">${escapeHtml(decision.rationale)}</p><p class="compact muted">${escapeHtml(decision.created_at)} · evidence ${escapeHtml(short(decision.evidence_digest,22))} · ${escapeHtml(decision.autonomy_mode)} · ${escapeHtml(decision.reversibility)}</p></div>`);
  for(const assessment of history.assessments){const details=parseMeta(assessment.details);events.push(`<div class="history"><b>${escapeHtml(assessment.level)} ${escapeHtml(assessment.dimension)} · ${escapeHtml(assessment.result)}</b><p class="compact">${escapeHtml(details.reason||details.check||'未记录计算理由')}</p><p class="compact muted">confidence ${assessment.confidence==null?'未记录':escapeHtml(Number(assessment.confidence).toFixed(2))} · ${escapeHtml(assessment.actor)} · ${escapeHtml(assessment.method)}</p></div>`)}
  return events.join('');
}
function whatIfHtml(detail,graph){
  const supports=list(detail.supports);if(!supports.length)return '<p class="empty">没有可移除的直接支持来源；模拟不会修改 committed graph。</p>';
  if(!state.whatIfSourceId||!supports.some(item=>item.id===state.whatIfSourceId))state.whatIfSourceId=supports[0].id;
  const impact=whatIfImpact(graph,state.whatIfSourceId);
  return `<p class="muted">只读模拟：临时移除一条支持来源，沿 supports / derived_from / same_as 依赖计算影响；不会 POST 或保存结果。</p><div class="what-if-buttons">${supports.map(item=>`<button type="button" data-what-if-source="${escapeHtml(item.id)}" aria-pressed="${item.id===state.whatIfSourceId}">${escapeHtml(short(item.content||item.id,32))}</button>`).join('')}</div><div id="what-if-result">${impact.affected.length?impact.affected.map(item=>`<div class="impact"><b>${item.kind==='unsupported'?'将失去全部直接支持':item.kind==='weakened'?'支持将减弱':'下游可能受影响'}：${escapeHtml(item.claim.statement)}</b><p class="compact muted">distance ${item.distance}${item.remainingSupportCount==null?'':` · remaining direct supports ${item.remainingSupportCount}`}</p></div>`).join(''):'<p class="empty">该来源在当前 committed graph 中没有可传播的 Claim 影响。</p>'}</div>`;
}
function renderDetail(){
  const container=document.getElementById('claim-detail'),detail=state.detail,graphSnapshot=object(state.graph?.snapshot),statusSnapshot=object(state.status?.committedSnapshot),snapshot=statusSnapshot.digest===graphSnapshot.digest?statusSnapshot:{...graphSnapshot,graph:state.graph,compileDiff:{}};
  if(!state.selectedClaimId){container.innerHTML='<h2 id="claim-detail-heading">Claim 详情</h2><p class="empty">选择一条 Claim，查看跨层原始证据、Decision 历史和只读 what-if。</p>';return}
  if(!detail){container.innerHTML='<h2 id="claim-detail-heading">Claim 详情</h2><p class="muted">正在读取固定 Snapshot 的详情…</p>';return}
  const provenance=object(detail.provenance),ranked=rankPaths(provenance.paths,detail.supports),independence=independentSources(provenance.paths),relations=relationModel(detail,state.graph),history=statusHistoryModel(detail,snapshot,state.findings),artifacts=[];
  for(const path of list(provenance.paths))for(const assertion of list(path.sourceAssertions))artifacts.push({path,assertion});
  container.innerHTML=`<h2 id="claim-detail-heading">Claim 详情</h2><p class="statement">${escapeHtml(detail.statement)}</p>${scopeHtml(detail,snapshot)}
    <section class="section"><h3>2. 最强支持路径</h3>${ranked.length?ranked.map(pathHtml).join(''):'<p class="empty">没有可解析的 session provenance path。</p>'}</section>
    <section class="section"><h3>3. 真正独立的来源</h3><p><b>${independence.sources.length}</b> 个可识别独立上游；${independence.unresolved.length} 条路径无法证明独立。</p>${independence.sources.length?`<ul class="plain-list">${independence.sources.map(item=>`<li><b>${escapeHtml(item.label)}</b> · ${escapeHtml(item.maxLevel)} · ${item.occurrences} 次引用 · sessions ${escapeHtml(item.threads.join('、'))}</li>`).join('')}</ul>`:'<p class="empty">不同 session 不自动算独立来源；当前没有可识别 Artifact 身份。</p>'}</section>
    <section class="section"><h3>4. 支持、反对与限定</h3><h3>支持 (${relations.supports.length})</h3>${relations.supports.length?relations.supports.map(item=>relationItem(item,'support')).join(''):'<p class="empty">无直接支持。</p>'}<h3>反对 / 失败复现 (${relations.opposing.length})</h3>${relations.opposing.length?relations.opposing.map(item=>relationItem(item,'oppose')).join(''):'<p class="empty">当前 committed scope 没有反对或失败复现节点。</p>'}<h3>限定 (${relations.qualifications.length})</h3>${relations.qualifications.length?relations.qualifications.map(item=>relationItem(item,'qualify')).join(''):'<p class="empty">当前 Snapshot 没有显式 refinement 或未通过的 applicability assessment。</p>'}</section>
    <section class="section"><h3>5. Artifact、Anchor 与 Run</h3>${artifacts.length?artifacts.map(item=>artifactHtml(item.assertion,item.path)).join(''):'<p class="empty">未到达 Artifact；查看下方 provenance breakpoint。</p>'}</section>
    <section class="section"><h3>6. 溯源等级与断点</h3><div class="facts"><span class="badge">${escapeHtml(provenance.provenanceLevel||'L0')}</span><span class="badge">reachesArtifact ${provenance.reachesArtifact?'yes':'no'}</span></div>${list(provenance.breakpoints).length?list(provenance.breakpoints).map(item=>`<div class="breakpoint"><b>${escapeHtml(item.reason)}</b><pre>${pretty(item)}</pre></div>`).join(''):'<p class="good">当前 resolver 没有报告溯源断点。</p>'}</section>
    <section class="section"><h3>7. Snapshot、审计与 Decision 历史</h3>${historyHtml(history)}${!history.decisions.length?'<p class="empty">没有与该 Claim 的 Finding 可证明关联的 DecisionEvent；项目级 Decision 不会被冒充为 Claim 历史。</p>':''}</section>
    <section class="section"><h3>8. 移除来源的 what-if 影响</h3>${whatIfHtml(detail,state.graph)}</section>`;
  for(const button of container.querySelectorAll('[data-what-if-source]'))button.onclick=()=>{state.whatIfSourceId=button.dataset.whatIfSource;renderDetail()};
}
function renderSidechains(){
  const attention=document.getElementById('attention'),findings=document.getElementById('findings'),currentDigest=state.graph?.snapshot?.digest,current=list(state.findings).filter(item=>item.target_digest===currentDigest);
  attention.innerHTML=list(state.attention).length?`<ul class="plain-list">${list(state.attention).map(item=>`<li><b>${escapeHtml(item.subject_type)} · ${escapeHtml(short(item.subject_id,18))}</b><br><span class="muted">score ${escapeHtml(item.score)} · ${item.blocking?'blocking':'non-blocking'} · ${escapeHtml(Object.entries(object(item.factors)).map(([key,value])=>`${key} ${value}`).join(' / '))}</span></li>`).join('')}</ul>`:'<p class="empty">当前 Snapshot 没有 attention item。</p>';
  findings.innerHTML=current.length?`<ul class="plain-list">${current.map(item=>`<li><b>${escapeHtml(item.finding_type)}</b> · ${escapeHtml(item.severity)} · ${escapeHtml(item.status)}<br><span class="muted">subject ${escapeHtml(short(item.subject_id,18))}</span></li>`).join('')}</ul>`:'<p class="empty">当前 Snapshot 没有 Finding。</p>';
}
async function selectClaim(claimId){
  state.selectedClaimId=claimId;state.detail=null;state.whatIfSourceId=null;renderClaims();renderDetail();
  try{const digest=state.graph?.snapshot?.digest;if(!digest)throw new Error('没有 committed snapshot');const detail=await api(`/claims/${encodeURIComponent(claimId)}?snapshot=${encodeURIComponent(digest)}`);if(state.selectedClaimId===claimId&&state.graph?.snapshot?.digest===digest){state.detail=detail;renderDetail()}}catch(error){renderError(error)}
}
async function refresh(){
  renderError(null);document.getElementById('refresh').disabled=true;
  try{
    const graph=await api('/graph'),digest=graph.snapshot?.digest;
    const [status,attention,findings]=await Promise.all([api('/updates/status'),digest?api(`/attention?snapshotDigest=${encodeURIComponent(digest)}`):Promise.resolve([]),api('/findings')]);
    state.graph=graph;state.status=status;state.attention=attention;state.findings=findings;
    if(state.selectedClaimId&&!list(graph.claims).some(item=>item.id===state.selectedClaimId)){state.selectedClaimId=null;state.detail=null;state.whatIfSourceId=null}
    renderSummary();renderClaims();renderSidechains();
    if(state.selectedClaimId)await selectClaim(state.selectedClaimId);else renderDetail();
  }catch(error){renderError(error)}finally{document.getElementById('refresh').disabled=false}
}
document.getElementById('refresh').onclick=refresh;refresh();
</script>
</body>
</html>
