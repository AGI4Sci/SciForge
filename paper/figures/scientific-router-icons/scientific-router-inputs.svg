<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 320" role="img" aria-labelledby="title desc">
  <title id="title">Scientific Router Inputs</title>
  <desc id="desc">Four scientific modality inputs handled by the SciForge Scientific Model Router.</desc>
  <defs>
    <style>
      .card { fill: #ffffff; stroke: #d6e0e7; stroke-width: 2; }
      .ink { fill: #23313a; font-family: Inter, Arial, sans-serif; }
      .muted { fill: #5d6f7a; font-family: Inter, Arial, sans-serif; }
      .stroke { stroke: #23313a; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
      .thin { stroke: #667985; stroke-width: 5; stroke-linecap: round; }
    </style>
    <linearGradient id="soft" x1="0" y1="45" x2="0" y2="214" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F8FBFF"/>
      <stop offset="1" stop-color="#E7F0F7"/>
    </linearGradient>
    <linearGradient id="tealblue" x1="75" y1="54" x2="176" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#18A999"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="violetblue" x1="43" y1="70" x2="214" y2="191" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7C5CFF"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="goldteal" x1="58" y1="54" x2="200" y2="196" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#18A999"/>
      <stop offset="1" stop-color="#F4B942"/>
    </linearGradient>
    <linearGradient id="nucleus" x1="92" y1="83" x2="154" y2="145" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#18A999"/>
      <stop offset="1" stop-color="#7C5CFF"/>
    </linearGradient>
  </defs>

  <rect class="card" x="24" y="24" width="240" height="272" rx="18"/>
  <rect class="card" x="288" y="24" width="240" height="272" rx="18"/>
  <rect class="card" x="552" y="24" width="240" height="272" rx="18"/>
  <rect class="card" x="816" y="24" width="220" height="272" rx="18"/>

  <g transform="translate(38 15) scale(.72)">
    <path d="M86 36c58 28 58 61 0 92s-58 64 0 92" fill="none" class="stroke"/>
    <path d="M170 36c-58 28-58 61 0 92s58 64 0 92" fill="none" stroke="url(#tealblue)" stroke-width="8" stroke-linecap="round"/>
    <path d="M99 58h58M91 86h74M91 128h74M99 170h58M110 201h36" fill="none" class="thin"/>
    <rect x="41" y="118" width="55" height="42" rx="12" fill="url(#soft)" class="stroke"/>
    <text x="68.5" y="145" text-anchor="middle" class="ink" font-size="16" font-weight="700">VCF</text>
    <circle cx="188" cy="80" r="16" fill="#F4B942" class="stroke"/>
    <path d="M188 70v20M178 80h20" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
  </g>
  <text x="144" y="222" text-anchor="middle" class="ink" font-size="22" font-weight="700">Gene Data</text>
  <text x="144" y="252" text-anchor="middle" class="muted" font-size="15">Route variants and sequences to</text>
  <text x="144" y="272" text-anchor="middle" class="muted" font-size="15">gene-aware experts.</text>

  <g transform="translate(302 15) scale(.72)">
    <image x="22" y="14" width="212" height="212" href="protein-data-clean.png"/>
  </g>
  <text x="408" y="222" text-anchor="middle" class="ink" font-size="22" font-weight="700">Protein Structure</text>
  <text x="408" y="252" text-anchor="middle" class="muted" font-size="15">Translate 3D structures into</text>
  <text x="408" y="272" text-anchor="middle" class="muted" font-size="15">protein evidence.</text>

  <g transform="translate(566 15) scale(.72)">
    <path d="M78 85l50-29 50 29v58l-50 29-50-29V85Z" fill="none" class="stroke"/>
    <path d="M91 93l37-21 37 21M165 135l-37 21M78 85l-28-17M178 85l25-20M178 143l31 18M78 143l-27 19" fill="none" class="thin"/>
    <circle cx="78" cy="85" r="16" fill="#FFFFFF" class="stroke"/>
    <circle cx="128" cy="56" r="16" fill="#18A999" class="stroke"/>
    <circle cx="178" cy="85" r="16" fill="#FFFFFF" class="stroke"/>
    <circle cx="178" cy="143" r="16" fill="#F4B942" class="stroke"/>
    <circle cx="128" cy="172" r="16" fill="#FFFFFF" class="stroke"/>
    <circle cx="78" cy="143" r="16" fill="#7C5CFF" class="stroke"/>
    <circle cx="31" cy="82" r="13" fill="#EF6F6C" class="stroke"/>
    <circle cx="225" cy="78" r="13" fill="#FFFFFF" class="stroke"/>
    <circle cx="230" cy="175" r="13" fill="#18A999" class="stroke"/>
    <text x="128" y="62" text-anchor="middle" class="ink" font-size="13" font-weight="700" fill="#FFFFFF">N</text>
    <text x="178" y="149" text-anchor="middle" class="ink" font-size="13" font-weight="700">O</text>
    <text x="78" y="149" text-anchor="middle" class="ink" font-size="13" font-weight="700" fill="#FFFFFF">S</text>
  </g>
  <text x="672" y="222" text-anchor="middle" class="ink" font-size="22" font-weight="700">Small Molecules</text>
  <text x="672" y="252" text-anchor="middle" class="muted" font-size="15">Convert chemical structures into</text>
  <text x="672" y="272" text-anchor="middle" class="muted" font-size="15">molecular evidence.</text>

  <g transform="translate(828 15) scale(.72)">
    <path d="M126 41c48 0 89 35 89 80 0 50-42 94-92 94-48 0-82-37-82-84 0-49 36-90 85-90Z" fill="url(#soft)" class="stroke"/>
    <path d="M95 111c0-24 18-43 42-43 23 0 38 17 38 39 0 25-20 42-42 42-21 0-38-15-38-38Z" fill="url(#nucleus)" class="stroke"/>
    <circle cx="83" cy="83" r="7" fill="#F4B942"/>
    <circle cx="190" cy="119" r="7" fill="#EF6F6C"/>
    <circle cx="78" cy="164" r="7" fill="#18A999"/>
    <circle cx="172" cy="177" r="7" fill="#3B82F6"/>
    <rect x="31" y="34" width="60" height="60" rx="13" fill="#FFFFFF" class="stroke"/>
    <path d="M47 51h2M62 51h2M77 51h2M47 66h2M62 66h2M77 66h2M47 81h2M62 81h2M77 81h2" fill="none" stroke="#18A999" stroke-width="6" stroke-linecap="round"/>
    <rect x="157" y="30" width="61" height="36" rx="12" fill="#FFFFFF" class="stroke"/>
    <text x="187.5" y="53" text-anchor="middle" class="ink" font-size="14" font-weight="700">scRNA</text>
  </g>
  <text x="926" y="222" text-anchor="middle" class="ink" font-size="22" font-weight="700">Cell Omics</text>
  <text x="926" y="252" text-anchor="middle" class="muted" font-size="15">Summarize expression and marker</text>
  <text x="926" y="272" text-anchor="middle" class="muted" font-size="15">patterns for reasoning.</text>
</svg>
