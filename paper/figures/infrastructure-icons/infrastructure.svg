    <rect x="146" y="66" width="48" height="38" rx="10" fill="#FFF7E6" class="stroke"/>
    <rect x="68" y="152" width="48" height="38" rx="10" fill="#F8FBFF" class="stroke"/>
    <rect x="146" y="152" width="48" height="38" rx="10" fill="url(#goldteal)" class="stroke"/>
    <path d="M92 104v48M116 85h30M170 104v48M116 171h30" fill="none" class="stroke"/>
    <circle cx="92" cy="85" r="8" fill="#18A999"/>
    <circle cx="170" cy="85" r="8" fill="#3B82F6"/>
    <circle cx="92" cy="171" r="8" fill="#7C5CFF"/>
    <circle cx="170" cy="171" r="8" fill="#FFFFFF" class="stroke"/>
    <path d="M161 171h18M170 162v18" fill="none" class="stroke"/>
  </g>
  <text x="408" y="220" text-anchor="middle" class="ink" font-size="20" font-weight="700">Modular Capability</text>
  <text x="408" y="245" text-anchor="middle" class="ink" font-size="20" font-weight="700">System</text>
  <text x="408" y="273" text-anchor="middle" class="muted" font-size="15">Packages Skills, MCP servers,</text>
  <text x="408" y="293" text-anchor="middle" class="muted" font-size="15">Plugins, and reusable tools.</text>

  <g transform="translate(566 19) scale(.74)">
    <circle cx="128" cy="128" r="43" fill="url(#purple)" class="stroke"/>
    <path d="M128 85v-31M128 171v31M85 128H54M171 128h31M98 98L76 76M158 98l22-22M98 158l-22 22M158 158l22 22" fill="none" class="stroke"/>
