<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 330" role="img" aria-labelledby="title desc">
  <title id="title">SciForge Infrastructure</title>
  <desc id="desc">Four Infrastructure modules in SciForge: Local Scientific Memory, Modular Capability System, Scientific Connectors, and Team Workspace Sync.</desc>
  <defs>
    <style>
      .card { fill: #ffffff; stroke: #d6e0e7; stroke-width: 2; }
      .ink { fill: #23313a; font-family: Inter, Arial, sans-serif; }
      .muted { fill: #5d6f7a; font-family: Inter, Arial, sans-serif; }
      .stroke { stroke: #23313a; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
      .thin { stroke: #667985; stroke-width: 5; stroke-linecap: round; }
    </style>
    <linearGradient id="soft" x1="0" y1="45" x2="0" y2="214" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F8FBFF"/>
      <stop offset="1" stop-color="#E7F0F7"/>
    </linearGradient>
    <linearGradient id="tealblue" x1="75" y1="54" x2="176" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#18A999"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="purple" x1="87" y1="82" x2="170" y2="169" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#18A999"/>
      <stop offset="1" stop-color="#7C5CFF"/>
    </linearGradient>
    <linearGradient id="goldteal" x1="98" y1="104" x2="215" y2="214" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F4B942"/>
      <stop offset="1" stop-color="#18A999"/>
    </linearGradient>
  </defs>

  <rect class="card" x="24" y="24" width="240" height="282" rx="18"/>
  <rect class="card" x="288" y="24" width="240" height="282" rx="18"/>
  <rect class="card" x="552" y="24" width="240" height="282" rx="18"/>
  <rect class="card" x="816" y="24" width="220" height="282" rx="18"/>

  <g transform="translate(38 19) scale(.74)">
    <path d="M50 62c0-18 35-32 78-32s78 14 78 32v124c0 20-35 36-78 36s-78-16-78-36V62Z" fill="url(#soft)" class="stroke"/>
    <ellipse cx="128" cy="62" rx="78" ry="32" fill="#FFFFFF" class="stroke"/>
    <path d="M50 103c0 18 35 32 78 32s78-14 78-32M50 145c0 18 35 32 78 32s78-14 78-32" fill="none" class="thin"/>
    <circle cx="128" cy="121" r="35" fill="url(#tealblue)" class="stroke"/>
    <circle cx="128" cy="121" r="13" fill="#FFFFFF" class="stroke"/>
    <path d="M128 86v22M128 134v22M93 121h22M141 121h22M104 97l15 15M137 130l15 15M152 97l-15 15M119 130l-15 15" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
