    <circle cx="205" cy="66" r="24" fill="#FFF7E6" class="stroke"/>
    <path d="M194 66h22M205 55v22" fill="none" stroke="#F4B942" stroke-width="7" stroke-linecap="round"/>
    <rect x="23" y="104" width="44" height="48" rx="10" fill="#F8FBFF" class="stroke"/>
    <path d="M35 120h20M35 135h20" fill="none" stroke="#18A999" stroke-width="5" stroke-linecap="round"/>
    <rect x="189" y="104" width="44" height="48" rx="10" fill="#FFFFFF" class="stroke"/>
    <path d="M201 137c7-20 16-20 23 0M204 126h16" fill="none" stroke="#7C5CFF" stroke-width="5" stroke-linecap="round"/>
    <path d="M98 192h60v22c0 10-13 18-30 18s-30-8-30-18v-22Z" fill="#FFFFFF" class="stroke"/>
    <ellipse cx="128" cy="192" rx="30" ry="12" fill="#E7F0F7" class="stroke"/>
  </g>
  <text x="672" y="220" text-anchor="middle" class="ink" font-size="21" font-weight="700">Scientific</text>
  <text x="672" y="245" text-anchor="middle" class="ink" font-size="21" font-weight="700">Connectors</text>
  <text x="672" y="273" text-anchor="middle" class="muted" font-size="15">Bridge files, APIs, databases,</text>
  <text x="672" y="293" text-anchor="middle" class="muted" font-size="15">instruments, and software.</text>

  <g transform="translate(827 19) scale(.74)">
    <rect x="47" y="47" width="162" height="146" rx="17" fill="url(#soft)" class="stroke"/>
    <path d="M47 78h162" fill="none" class="stroke"/>
    <circle cx="70" cy="63" r="5" fill="#EF6F6C"/>
    <circle cx="88" cy="63" r="5" fill="#F4B942"/>
    <circle cx="106" cy="63" r="5" fill="#18A999"/>
    <path d="M83 113h36M83 135h54M83 157h32" fill="none" class="thin"/>
    <circle cx="65" cy="113" r="6" fill="#18A999"/>
    <circle cx="65" cy="135" r="6" fill="#3B82F6"/>
    <circle cx="65" cy="157" r="6" fill="#F4B942"/>
    <circle cx="162" cy="126" r="24" fill="url(#tealblue)" class="stroke"/>
    <path d="M151 126l8 8 16-20" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/>
    <path d="M54 207c14 16 39 26 68 26 31 0 58-12 71-30" fill="none" stroke="#18A999" stroke-width="7" stroke-linecap="round"/>
    <path d="M185 224l9-22-23 4" fill="none" stroke="#18A999" stroke-width="7" stroke-linecap="round"/>
    <path d="M202 45c-14-15-39-24-68-24-30 0-56 10-70 27" fill="none" stroke="#3B82F6" stroke-width="7" stroke-linecap="round"/>
    <path d="M72 27l-10 22 23-3" fill="none" stroke="#3B82F6" stroke-width="7" stroke-linecap="round"/>
    <rect x="190" y="183" width="36" height="54" rx="9" fill="#FFFFFF" class="stroke"/>
  </g>
  <text x="926" y="220" text-anchor="middle" class="ink" font-size="21" font-weight="700">Team Workspace</text>
  <text x="926" y="245" text-anchor="middle" class="ink" font-size="21" font-weight="700">Sync</text>
  <text x="926" y="273" text-anchor="middle" class="muted" font-size="15">Synchronizes shared context,</text>
  <text x="926" y="293" text-anchor="middle" class="muted" font-size="15">tasks, reviews, and supervision.</text>
</svg>
