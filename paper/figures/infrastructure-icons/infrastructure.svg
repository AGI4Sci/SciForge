    <path d="M56 42h53c9 0 16 7 16 16v19c0 6 5 11 11 11s11-5 11-11V58c0-9 7-16 16-16h37c9 0 16 7 16 16v52c0 9-7 16-16 16h-19c-6 0-11 5-11 11s5 11 11 11h19c9 0 16 7 16 16v36c0 9-7 16-16 16h-52c-9 0-16-7-16-16v-19c0-6-5-11-11-11s-11 5-11 11v19c0 9-7 16-16 16H56c-9 0-16-7-16-16v-52c0-9 7-16 16-16h19c6 0 11-5 11-11s-5-11-11-11H56c-9 0-16-7-16-16V58c0-9 7-16 16-16Z" fill="#FFFFFF" class="stroke"/>
    <path d="M56 42h53c9 0 16 7 16 16v19c0 6 5 11 11 11s11-5 11-11V58c0-9 7-16 16-16h37c9 0 16 7 16 16v52c0 9-7 16-16 16h-19c-6 0-11 5-11 11s5 11 11 11h19c9 0 16 7 16 16v36c0 9-7 16-16 16h-52c-9 0-16-7-16-16v-19c0-6-5-11-11-11s-11 5-11 11v19c0 9-7 16-16 16H56c-9 0-16-7-16-16v-52c0-9 7-16 16-16h19c6 0 11-5 11-11s-5-11-11-11H56c-9 0-16-7-16-16V58c0-9 7-16 16-16Z" fill="url(#tealblue)" opacity="0.18"/>
