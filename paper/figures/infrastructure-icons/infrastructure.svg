    <circle cx="128" cy="187" r="7" fill="#18A999" class="stroke"/>
    <circle cx="188" cy="187" r="7" fill="#EF6F6C" class="stroke"/>
  </g>
  <text x="144" y="220" text-anchor="middle" class="ink" font-size="21" font-weight="700">Local Scientific</text>
  <text x="144" y="245" text-anchor="middle" class="ink" font-size="21" font-weight="700">Memory</text>
  <text x="144" y="273" text-anchor="middle" class="muted" font-size="15">Persists artifacts, indexes,</text>
  <text x="144" y="293" text-anchor="middle" class="muted" font-size="15">traces, and project state.</text>

