<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">SciForge Collaboration Entrypoints</title>
  <desc id="desc">Three entrypoints for the SciForge user collaboration layer: desktop app, group chat room, and mobile remote.</desc>
  <defs>
    <style>
      .card { fill: #ffffff; stroke: #d6e0e7; stroke-width: 2; }
      .ink { fill: #23313a; font-family: Inter, Arial, sans-serif; }
      .muted { fill: #5d6f7a; font-family: Inter, Arial, sans-serif; }
      .stroke { stroke: #23313a; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
      .thin { stroke: #667985; stroke-width: 5; stroke-linecap: round; }
    </style>
    <linearGradient id="screen" x1="86" y1="58" x2="224" y2="184" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#e7f0f7"/>
    </linearGradient>
    <linearGradient id="accent" x1="100" y1="82" x2="195" y2="155" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#18a999"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="bubble" x1="376" y1="64" x2="556" y2="196" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f9fcff"/>
      <stop offset="1" stop-color="#e9f1f6"/>
    </linearGradient>
    <linearGradient id="agent" x1="437" y1="92" x2="501" y2="152" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#18a999"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
    <linearGradient id="phone" x1="731" y1="48" x2="849" y2="228" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#e8f0f5"/>
    </linearGradient>
    <linearGradient id="check" x1="759" y1="101" x2="821" y2="163" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#18a999"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <rect class="card" x="32" y="28" width="280" height="304" rx="18"/>
  <rect class="card" x="340" y="28" width="280" height="304" rx="18"/>
  <rect class="card" x="648" y="28" width="280" height="304" rx="18"/>

  <g transform="translate(32 0)">
    <rect x="72" y="54" width="156" height="116" rx="16" fill="url(#screen)" class="stroke"/>
    <path d="M72 132h156" class="stroke" fill="none"/>
    <path d="M132 170h36l8 27h-52l8-27Z" fill="#dde8ef" class="stroke"/>
    <path d="M112 204h76" class="stroke" fill="none"/>
    <rect x="98" y="76" width="54" height="36" rx="9" fill="#fff" class="stroke" stroke-width="5"/>
    <path d="M110 92h24M110 103h16" class="thin" fill="none"/>
    <circle cx="180" cy="111" r="16" fill="url(#accent)" class="stroke" stroke-width="5"/>
    <path d="M180 82v14M180 126v14M154 111h14M192 111h16" class="stroke" stroke-width="5" fill="none"/>
    <circle cx="180" cy="111" r="4" fill="#fff"/>
    <text x="140" y="260" text-anchor="middle" class="ink" font-size="24" font-weight="700">Desktop App</text>
    <text x="140" y="291" text-anchor="middle" class="muted" font-size="17">Local execution · workspace context</text>
  </g>

  <g transform="translate(340 0)">
    <path d="M62 68h156c13 0 24 11 24 24v70c0 13-11 24-24 24h-66l-35 27v-27H62c-13 0-24-11-24-24V92c0-13 11-24 24-24Z" fill="url(#bubble)" class="stroke"/>
    <circle cx="91" cy="122" r="15" fill="#f4b942" class="stroke" stroke-width="5"/>
    <path d="M62 158c7-17 21-26 29-26s22 9 29 26" fill="#fff" class="stroke" stroke-width="5"/>
    <circle cx="189" cy="122" r="15" fill="#ef6f6c" class="stroke" stroke-width="5"/>
    <path d="M160 158c7-17 21-26 29-26s22 9 29 26" fill="#fff" class="stroke" stroke-width="5"/>
    <circle cx="140" cy="102" r="20" fill="url(#agent)" class="stroke" stroke-width="5"/>
    <path d="M125 139c8-19 23-29 34-29s26 10 34 29" fill="#fff" class="stroke" stroke-width="5"/>
    <path d="M132 101h16M140 93v16" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
    <text x="140" y="260" text-anchor="middle" class="ink" font-size="24" font-weight="700">Group Chat Room</text>
    <text x="140" y="291" text-anchor="middle" class="muted" font-size="17">Shared room · lead-agent orchestration</text>
  </g>

  <g transform="translate(648 0)">
    <rect x="91" y="42" width="98" height="188" rx="23" fill="url(#phone)" class="stroke"/>
    <path d="M124 65h31" class="stroke" stroke-width="5" fill="none"/>
    <circle cx="140" cy="208" r="6" fill="#23313a"/>
    <rect x="110" y="84" width="60" height="29" rx="8" fill="#fff" class="stroke" stroke-width="5"/>
    <path d="M121 99h24M155 99h7" class="thin" fill="none"/>
    <circle cx="140" cy="141" r="29" fill="url(#check)" class="stroke" stroke-width="5"/>
    <path d="M126 142l10 10 20-23" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M111 184h58" class="stroke" stroke-width="5" fill="none"/>
    <path d="M111 184h36" fill="none" stroke="#f4b942" stroke-width="5" stroke-linecap="round"/>
    <path d="M196 87c11 8 18 20 18 34s-7 26-18 34M207 70c18 13 29 31 29 51s-11 38-29 51" fill="none" stroke="#18a999" stroke-width="6" stroke-linecap="round"/>
    <text x="140" y="260" text-anchor="middle" class="ink" font-size="24" font-weight="700">Mobile Remote</text>
    <text x="140" y="291" text-anchor="middle" class="muted" font-size="17">Remote supervision · approval control</text>
  </g>
</svg>
