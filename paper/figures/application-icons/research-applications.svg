<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">SciForge Research Applications</title>
  <desc id="desc">Five AI-native research application surfaces in SciForge.</desc>
  <defs>
    <style>
      .card { fill: #ffffff; stroke: #d6e0e7; stroke-width: 2; }
      .ink { fill: #23313a; font-family: Inter, Arial, sans-serif; }
      .muted { fill: #5d6f7a; font-family: Inter, Arial, sans-serif; }
      .stroke { stroke: #23313a; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
      .thin { stroke: #667985; stroke-width: 5; stroke-linecap: round; }
    </style>
    <linearGradient id="soft" x1="0" y1="60" x2="0" y2="190" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F8FBFF"/>
      <stop offset="1" stop-color="#E7F0F7"/>
    </linearGradient>
    <linearGradient id="tealblue" x1="0" y1="0" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#18A999"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="idea" x1="0" y1="0" x2="70" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F4B942"/>
      <stop offset="1" stop-color="#18A999"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="90" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7C5CFF"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>

