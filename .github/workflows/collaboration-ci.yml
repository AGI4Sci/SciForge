name: Collaboration CI

on:
  pull_request:
    paths:
      - ".github/workflows/collaboration-ci.yml"
      - "packages/collaboration-*/**"
      - "packages/domains/**"
      - "packages/domain-sdk/**"
      - "docs/adr/**"
      - "docs/contexts/identity-access/**"
      - "scripts/collaboration-*.mjs"
      - "scripts/domain-package-tarball-smoke.test.mjs"
      - "scripts/domain-packages.mjs"
      - "scripts/identity-access-docs.test.mjs"
      - "scripts/dev-bootstrap*.mjs"
      - "scripts/*delivery.test.mjs"
      - "scripts/publishable-package-version-audit.mjs"
      - "src/main/domain-*.ts"
      - "src/main/index.ts"
      - "src/main/principal-context*"
      - "src/main/capabilities/agent-tools*"
      - "src/main/capabilities/broker*"
      - "src/main/capabilities/content-space-discovery.test.ts"
      - "src/main/capabilities/identity-principal-transition.integration.test.ts"
      - "src/main/capabilities/registry*"
      - "src/main/ipc/register-app-ipc-handlers*"
      - "src/preload/index.ts"
      - "src/renderer/src/components/chat/WorkbenchTopBar*"
      - "src/renderer/src/dev/dev-sciforge-bridge.ts"
      - "src/renderer/src/lib/capability-client*"
      - "src/shared/capability-broker.ts"
      - "src/shared/sciforge-api.ts"
      - "package.json"
      - "package-lock.json"
      - "docs/capability-eval.md"
      - "docs/generated/capability-*.md"
      - "eval-cases/capability/**"
      - "scripts/capability-eval*.mjs"
      - "scripts/compare-capability-eval-runs.mjs"
      - "scripts/generate-capability-eval-*.mjs"
      - "src/main/capability-eval/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/collaboration-ci.yml"
      - "packages/collaboration-*/**"
      - "packages/domains/**"
      - "packages/domain-sdk/**"
      - "docs/adr/**"
      - "docs/contexts/identity-access/**"
      - "scripts/collaboration-*.mjs"
      - "scripts/domain-package-tarball-smoke.test.mjs"
      - "scripts/domain-packages.mjs"
      - "scripts/identity-access-docs.test.mjs"
      - "scripts/dev-bootstrap*.mjs"
      - "scripts/*delivery.test.mjs"
      - "scripts/publishable-package-version-audit.mjs"
      - "src/main/domain-*.ts"
      - "src/main/index.ts"
      - "src/main/principal-context*"
      - "src/main/capabilities/agent-tools*"
      - "src/main/capabilities/broker*"
      - "src/main/capabilities/content-space-discovery.test.ts"
      - "src/main/capabilities/identity-principal-transition.integration.test.ts"
      - "src/main/capabilities/registry*"
      - "src/main/ipc/register-app-ipc-handlers*"
      - "src/preload/index.ts"
      - "src/renderer/src/components/chat/WorkbenchTopBar*"
      - "src/renderer/src/dev/dev-sciforge-bridge.ts"
      - "src/renderer/src/lib/capability-client*"
      - "src/shared/capability-broker.ts"
      - "src/shared/sciforge-api.ts"
      - "package.json"
      - "package-lock.json"
      - "docs/capability-eval.md"
      - "docs/generated/capability-*.md"
      - "eval-cases/capability/**"
      - "scripts/capability-eval*.mjs"
      - "scripts/compare-capability-eval-runs.mjs"
      - "scripts/generate-capability-eval-*.mjs"
      - "src/main/capability-eval/**"

  # Extended platform coverage (macOS legs run at a 10x minutes multiplier).
  # Kept out of every push/PR to protect Actions quota: run on demand or weekly.
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

concurrency:
  group: collaboration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit publishable package versions
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin \
            "${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
          node scripts/publishable-package-version-audit.mjs \
            --base "origin/${{ github.base_ref }}"

      - name: Run full application typecheck
        run: npm run typecheck

      - name: Run full regression suite
        run: npm test

      - name: Enforce architecture principles
        run: npm run architecture-principles:test

      - name: Run lint
        run: npm run lint

      - name: Verify public delivery contracts
        run: npm run contracts:test

      - name: Verify CI routing contract
        run: node --test scripts/collaboration-ci.test.mjs

      - name: Run generic capability boundary tests
        run: |
          npx vitest run \
            src/main/capabilities/broker.test.ts \
            src/main/capabilities/agent-tools.test.ts \
            src/main/capabilities/content-space-discovery.test.ts \
            src/renderer/src/lib/capability-client.test.ts

      - name: Run identity package and persistence tests
        run: |
          npm --workspace @sciforge/domain-identity-access test
          npx vitest run src/main/domain-package-storage.test.ts

      - name: Run Host identity boundary tests
        run: |
          npx vitest run \
            src/main/ipc/register-app-ipc-handlers.test.ts \
            src/renderer/src/components/chat/WorkbenchTopBar.test.ts

      - name: Run domain SDK and Principal transition tests
        run: |
          npm run domain-sdk:test
          npx vitest run \
            src/main/principal-context.test.ts \
            src/main/capabilities/identity-principal-transition.integration.test.ts

      - name: Verify generated composition and capabilities
        run: |
          npm run domain-packages:generate
          git diff --exit-code
          npm run domain-packages:check
          node scripts/ci-retry.mjs --attempts=3 --delay-seconds=5 -- npm run smoke:domain-packages:tarball
          npm run capability:check
          npm run capability:eval:check
          npm run eval:capability
          npm run eval:capability:self-test
          npm run capability:eval:baseline -- --runs 2 --output-root eval-results/ci-baseline

  desktop-agent-platform-contract:
    name: Desktop Agent (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            os: ubuntu-latest
          - platform: macOS
            os: macos-latest
          - platform: Windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        if: matrix.platform != 'macOS' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        # macOS minutes bill at a 10x multiplier: use dispatch/weekly runs.
        run: npm ci

      - name: Verify session navigation on the Desktop platform
        if: matrix.platform != 'macOS' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        run: |
          npx vitest run src/renderer/src/domain-modules/workbench-session-ownership.test.ts src/renderer/src/domain-modules/workbench-session-ownership.interaction.test.tsx src/renderer/src/components/chat/SidebarProjectsSection.test.ts
          npm --workspace @sciforge/domain-collaboration test

      - name: Verify Identity private vault and Host encryption policy
        if: matrix.platform != 'macOS' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        run: |
          npm --workspace @sciforge/domain-identity-access test
          npx vitest run src/main/domain-package-storage.test.ts

      - name: Build the Desktop application
        if: matrix.platform != 'macOS' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        env:
          NODE_OPTIONS: "--max-old-space-size=6144"
        run: npm run build

      - name: Verify source Electron application path
        if: matrix.platform == 'macOS' && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
        run: npm run smoke:electron:source

      - name: Verify packaged Electron application path
        if: matrix.platform == 'macOS' && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
        env:
          NODE_OPTIONS: "--max-old-space-size=6144"
        run: npm run smoke:electron:packaged:build

      - name: Verify Windows provider and package tooling
        if: matrix.platform == 'Windows'
        run: |
          node --test ./scripts/domain-packages.test.mjs
          node scripts/ci-retry.mjs --attempts=3 --delay-seconds=5 -- npm run smoke:domain-packages:tarball

  extended-desktop-contract:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm run contracts:test
