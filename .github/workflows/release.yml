name: Release (macOS)

# macOS-only release pipeline.
#
# Scope: builds a signed + notarized macOS dmg/zip pair (arm64 and x64) and
# uploads them to a DRAFT GitHub Release. Windows and Linux jobs, and the final
# "publish" step that flipped the draft to public, are intentionally absent:
# publishing stays a human decision after installer acceptance on real hardware.
#
# Required secrets for the signed path:
#   MAC_CODESIGN_P12_BASE64, CSC_KEY_PASSWORD,
#   APPLE_API_KEY_BASE64, APPLE_API_KEY_ID, APPLE_API_ISSUER
# R2_* secrets are optional; without them the release is GitHub-only.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (x.y.z)"
        required: true
        type: string
      ref:
        description: "Git ref to build"
        required: true
        default: "main"
        type: string
permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  NODE_OPTIONS: "--max-old-space-size=6144"
  RELEASE_CHANNEL: stable
  RELEASE_ARTIFACT_PREFIX: SciForge
  SCIFORGE_PUBLIC_RELEASE: "1"

jobs:
  prepare:
    name: Prepare release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      release_name: ${{ steps.version.outputs.release_name }}
      previous_tag: ${{ steps.version.outputs.previous_tag }}
      existing_tag: ${{ steps.version.outputs.existing_tag }}
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.ref }}

      - name: Pin a commit from main
        id: source
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          source_sha="$(git rev-parse HEAD)"
          if ! git merge-base --is-ancestor "${source_sha}" origin/main; then
            echo "::error::Release ref must resolve to a commit in origin/main"
            exit 1
          fi
          echo "sha=${source_sha}" >> "${GITHUB_OUTPUT}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Compute release version
        id: version
        env:
          CI_RELEASE_VERSION: ${{ github.event.inputs.version }}
        run: node ./scripts/compute-ci-release-version.cjs

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    needs: prepare
    env:
      SCIFORGE_APP_VERSION: ${{ needs.prepare.outputs.version }}
      SCIFORGE_RELEASE_SOURCE_COMMIT: ${{ needs.prepare.outputs.source_sha }}
      SCIFORGE_UPDATE_CHANNEL: stable
      RELEASE_CHANNEL: stable
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
    steps:
      - name: Check out pinned release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.source_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Guard public release composition
        run: node ./scripts/public-release-guard.cjs

      - name: Decode Apple signing credentials
        env:
          MAC_CODESIGN_P12_BASE64: ${{ secrets.MAC_CODESIGN_P12_BASE64 }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          set -euo pipefail

          for name in MAC_CODESIGN_P12_BASE64 CSC_KEY_PASSWORD APPLE_API_KEY_BASE64 APPLE_API_KEY_ID APPLE_API_ISSUER; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required secret or environment value: ${name}"
              exit 1
            fi
          done

          cert_path="${RUNNER_TEMP}/developer-id.p12"
          key_path="${RUNNER_TEMP}/AuthKey_${APPLE_API_KEY_ID}.p8"
          export CERT_PATH="${cert_path}"
          export KEY_PATH="${key_path}"

          node <<'NODE'
          const fs = require('node:fs')
          fs.writeFileSync(process.env.CERT_PATH, Buffer.from(process.env.MAC_CODESIGN_P12_BASE64, 'base64'))
          fs.writeFileSync(process.env.KEY_PATH, Buffer.from(process.env.APPLE_API_KEY_BASE64, 'base64'))
          NODE

          {
            echo "CSC_LINK=${cert_path}"
            echo "APPLE_API_KEY=${key_path}"
            echo "MAC_SIGN=1"
          } >> "${GITHUB_ENV}"

      - name: Verify Apple signing credentials
        run: >
          npm run verify:apple -- --p12 "${CSC_LINK}"
          --p12-password "${CSC_KEY_PASSWORD}"
          --p8 "${APPLE_API_KEY}"
          --key-id "${APPLE_API_KEY_ID}"
          --issuer "${APPLE_API_ISSUER}"
          --check-notary

      - name: Build signed macOS packages
        run: npm run dist:mac:signed

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-mac
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/${{ env.RELEASE_ARTIFACT_PREFIX }}-*-mac-*.dmg
            dist/${{ env.RELEASE_ARTIFACT_PREFIX }}-*-mac-*.zip
            dist/${{ env.RELEASE_ARTIFACT_PREFIX }}-*-mac-*.blockmap
            dist/latest-mac.yml
            dist/release-mac.json

  publish:
    name: Publish GitHub Release and optional R2
    runs-on: ubuntu-latest
    needs:
      - prepare
      - build-macos
    env:
      GH_TOKEN: ${{ github.token }}
      TAG_NAME: ${{ needs.prepare.outputs.tag }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_NAME: ${{ needs.prepare.outputs.release_name }}
      RELEASE_SOURCE_REF: ${{ github.event.inputs.ref }}
      RELEASE_SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
      PREVIOUS_TAG: ${{ needs.prepare.outputs.previous_tag }}
      RELEASE_CHANNEL: stable
      SCIFORGE_UPDATE_CHANNEL: stable
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
      R2_RELEASE_PREFIX: ${{ secrets.R2_RELEASE_PREFIX }}
    steps:
      - name: Check out pinned release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.source_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Guard public release composition
        run: node ./scripts/public-release-guard.cjs

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-artifacts
          merge-multiple: true

      - name: Verify release artifacts
        run: |
          set -euo pipefail
          required=(
            "${RELEASE_ARTIFACT_PREFIX}-*-mac-arm64.dmg"
            "${RELEASE_ARTIFACT_PREFIX}-*-mac-x64.dmg"
            "${RELEASE_ARTIFACT_PREFIX}-*-mac-arm64.zip"
            "${RELEASE_ARTIFACT_PREFIX}-*-mac-x64.zip"
            "latest-mac.yml"
            "release-mac.json"
          )

          for pattern in "${required[@]}"; do
            if ! compgen -G "release-artifacts/${pattern}" > /dev/null; then
              echo "::error::Missing release artifact matching ${pattern}"
              find release-artifacts -maxdepth 2 -type f -print | sort
              exit 1
            fi
          done

          find release-artifacts -maxdepth 2 -type f -print | sort

      - name: Generate release notes
        run: |
          set -euo pipefail
          if [[ -n "${PREVIOUS_TAG}" ]]; then
            node ./scripts/generate-release-notes.cjs "${PREVIOUS_TAG}" > release-notes.md
          else
            node ./scripts/generate-release-notes.cjs > release-notes.md
          fi

          {
            echo
            echo "---"
            echo
            echo "### 构建信息"
            echo
            echo "- Release version: \`${RELEASE_VERSION}\`"
            echo "- Release channel: \`${RELEASE_CHANNEL}\`"
            echo "- Source ref: \`${RELEASE_SOURCE_REF}\`"
            echo "- Commit: \`${RELEASE_SOURCE_SHA}\`"
            echo "- macOS: Developer ID signed and notarized"
            echo "- Platforms: macOS arm64/x64, Windows x64, Linux x64"
          } >> release-notes.md

      - name: Ensure release tag
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          head_sha="$(git rev-parse HEAD)"
          if git rev-parse -q --verify "refs/tags/${TAG_NAME}" > /dev/null; then
            tag_sha="$(git rev-list -n 1 "${TAG_NAME}")"
            if [[ "${tag_sha}" != "${head_sha}" ]]; then
              echo "::error::Tag ${TAG_NAME} points at ${tag_sha}, expected ${head_sha}"
              exit 1
            fi
            echo "Reusing existing tag ${TAG_NAME}"
          else
            git tag -a "${TAG_NAME}" -m "${RELEASE_NAME}" "${head_sha}"
            git push origin "refs/tags/${TAG_NAME}"
          fi

      - name: Create or update draft GitHub Release
        run: |
          set -euo pipefail
          if gh release view "${TAG_NAME}" > /dev/null 2>&1; then
            gh release edit "${TAG_NAME}" \
              --title "${RELEASE_NAME}" \
              --notes-file release-notes.md
          else
            gh release create "${TAG_NAME}" \
              --draft \
              --title "${RELEASE_NAME}" \
              --notes-file release-notes.md \
              --verify-tag
          fi

      - name: Upload GitHub Release assets
        run: |
          set -euo pipefail
          mapfile -d '' assets < <(
            find release-artifacts -type f \
              \( -name "${RELEASE_ARTIFACT_PREFIX}-*" -o -name 'latest*.yml' -o -name 'release-*.json' \) \
              -print0
          )

          if [[ "${#assets[@]}" -eq 0 ]]; then
            echo "::error::No release assets found"
            exit 1
          fi

          gh release upload "${TAG_NAME}" "${assets[@]}" --clobber

      - name: Upload release archive to R2
        if: >-
          env.R2_BUCKET != '' &&
          env.R2_ACCOUNT_ID != '' &&
          env.R2_ACCESS_KEY_ID != '' &&
          env.R2_SECRET_ACCESS_KEY != ''
        run: |
          set -euo pipefail
          node ./scripts/publish-r2.mjs upload --platform mac --dist release-artifacts --tag "${TAG_NAME}" --channel "${RELEASE_CHANNEL}"

      - name: Promote R2 latest
        if: >-
          env.R2_BUCKET != '' &&
          env.R2_ACCOUNT_ID != '' &&
          env.R2_ACCESS_KEY_ID != '' &&
          env.R2_SECRET_ACCESS_KEY != ''
        run: >
          node ./scripts/publish-r2.mjs promote
          --tag "${TAG_NAME}"
          --dist release-artifacts
          --channel "${RELEASE_CHANNEL}"
          --platforms mac

