name: Publish research needs map

on:
  push:
    branches:
      - main
    paths:
      - "docs/research-agent-needs-site/**"
      - ".github/workflows/research-needs-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/research-agent-needs-site/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: docs/research-agent-needs-site

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build static site
        run: npm run build:pages
        working-directory: docs/research-agent-needs-site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/research-agent-needs-site/dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
